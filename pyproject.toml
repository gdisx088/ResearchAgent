[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "A local-first multi-agent deep research workbench backed by PaperLens and public web search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.22.1",
  "deepagents==0.5.7",
  "ddgs==9.16.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langchain==1.2.17",
  "langchain-core==1.6.1",
  "langchain-openai==1.2.1",
  "langgraph==1.1.10",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.2",
  "python-multipart>=0.0.20,<1",
  "trafilatura==2.2.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

